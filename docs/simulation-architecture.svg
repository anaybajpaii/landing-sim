<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Landing simulator closed-loop architecture</title>
<desc id="desc">Moving platform observations pass through a camera and Kalman filter to tracking guidance, cascaded controllers, motor mixer and quadcopter plant. Vehicle-state feedback returns to guidance and position history supports delayed camera measurement compensation.</desc>
<defs>
  <style>
    .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1.4}
    .blue{fill:#172b42;stroke:#58a6ff}.green{fill:#182f25;stroke:#3fb950}.purple{fill:#2a2038;stroke:#d2a8ff}
    .node{stroke-width:1.6}.label{fill:#e6edf3;font:600 14px Arial,sans-serif;text-anchor:middle}.small{fill:#8b949e;font:12px Arial,sans-serif;text-anchor:middle}
    .section{fill:#8b949e;font:700 12px Arial,sans-serif;letter-spacing:1.5px}
    .line{fill:none;stroke:#8b949e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fb{fill:none;stroke:#d2a8ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8b949e"/></marker>
  <marker id="fbarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#d2a8ff"/></marker>
</defs>
<rect class="bg" width="1200" height="350" rx="16"/>
<text x="32" y="34" class="section">SENSING, ESTIMATION &amp; CLOSED-LOOP CONTROL</text>
<!-- Main signal path -->
<g>
  <rect x="28" y="76" width="126" height="76" rx="10" class="node blue"/>
  <text x="91" y="108" class="label">Moving</text><text x="91" y="127" class="label">Platform</text>
  <rect x="174" y="76" width="126" height="76" rx="10" class="node blue"/>
  <text x="237" y="108" class="label">Camera</text><text x="237" y="128" class="small">noise · delay · dropouts</text>
  <rect x="320" y="76" width="136" height="76" rx="10" class="node blue"/>
  <text x="388" y="108" class="label">Kalman Filter</text><text x="388" y="128" class="small">target state estimate</text>
  <rect x="476" y="76" width="136" height="76" rx="10" class="node green"/>
  <text x="544" y="108" class="label">Tracking</text><text x="544" y="127" class="label">Guidance</text>
  <rect x="632" y="76" width="142" height="76" rx="10" class="node green"/>
  <text x="703" y="108" class="label">Position /</text><text x="703" y="127" class="label">Altitude Control</text>
  <rect x="794" y="76" width="116" height="76" rx="10" class="node green"/>
  <text x="852" y="118" class="label">Attitude PID</text>
  <rect x="930" y="76" width="112" height="76" rx="10" class="node green"/>
  <text x="986" y="118" class="label">Motor Mixer</text>
  <rect x="1062" y="76" width="110" height="76" rx="10" class="node purple"/>
  <text x="1117" y="108" class="label">Quadcopter</text><text x="1117" y="127" class="label">Plant</text>
</g>
<g class="line" marker-end="url(#arr)">
  <path d="M154 114H170"/><path d="M300 114H316"/><path d="M456 114H472"/><path d="M612 114H628"/><path d="M774 114H790"/><path d="M910 114H926"/><path d="M1042 114H1058"/>
</g>
<!-- Feedback loops -->
<path d="M1117 152V218H544V156" class="fb" marker-end="url(#fbarr)"/>
<text x="830" y="207" class="small" fill="#d2a8ff">vehicle state feedback to guidance</text>
<path d="M1117 152V278H388V156" class="fb" marker-end="url(#fbarr)"/>
<text x="745" y="267" class="small" fill="#d2a8ff">vehicle position history for delayed-measurement compensation</text>
<text x="32" y="326" class="small" text-anchor="start">Blue: target sensing and estimation</text>
<text x="300" y="326" class="small" text-anchor="start">Green: guidance and control</text>
<text x="570" y="326" class="small" text-anchor="start">Purple: vehicle dynamics and feedback</text>
</svg>
